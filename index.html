<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Sunamap</title>

    <style>
        .biz-udpgothic-regular {
            font-family: "BIZ UDPGothic", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .biz-udpgothic-bold {
            font-family: "BIZ UDPGothic", sans-serif;
            font-weight: 700;
            font-style: normal;
        }

        .inter-<uniquifier> {
            font-family: "Inter", sans-serif;
            font-optical-sizing: auto;
            font-weight: <weight>;
            font-style: normal;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "BIZ UDPGothic", sans-serif;
            background-color: #efefef;
        }

        h1 {
            font-family: "Inter", sans-serif;
            font-size: 24px;
            font-weight: 900;
            margin: 16px;
            text-align: center;
        }

        p{ 
            font-family: "Inter", "BIZ UDPGothic", sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin: 0 16px 16px 16px;
            text-align: center;
        }

        gmp-map {
            height: 70vh;
            width: 100%;
        }

        .info-window {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Suna-map</h1>
    <p>このアプリは、周辺で則先生がレビューしたことのある飲食店だけを探して表示するアプリです。</p>

    <!-- 初期位置は一旦東京駅に設定（現在地が取得できたら自動で移動） -->
    <gmp-map center="35.681236,139.767125" zoom="14" map-id="DEMO_MAP_ID"></gmp-map>

    <script>
        // ==========================================
        // 設定項目
        // ==========================================
        // 1. 読み込むスプレッドシートのURL
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1T-2Q39vpoBplKenbbQ6mRVIjb2nSDjEdzCKta4iwXTo/export?format=csv";

        // 2. Google Maps APIの読み込み
        (g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + " could not load.")); a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a) })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)) })({
            key: "AIzaSyApyFiIeY0BkNINgy3oWN5XjDcUmqqtAXo", // Maps APIのAPIキー
            v: "weekly",
        });

        // ==========================================
        // メイン処理
        // ==========================================
        async function init() {
            const [{ AdvancedMarkerElement }, { InfoWindow }] = await Promise.all([
                google.maps.importLibrary('marker'),
                google.maps.importLibrary('maps'),
            ]);

            const mapElement = document.querySelector('gmp-map');
            const innerMap = mapElement.innerMap;

            innerMap.setOptions({
                mapTypeControl: false,
                gestureHandling: 'greedy' // ★これで一本指でスイスイ動かせるようになります！
            });
            const infoWindow = new InfoWindow();

            // ------------------------------------------
            // 現在地取得して中心に持ってくる
            // ------------------------------------------
            // ------------------------------------------
            // 機能①：現在地を取得して地図の中心にする（スマホ改善版）
            // ------------------------------------------
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        innerMap.setCenter(userLocation);

                        new AdvancedMarkerElement({
                            map: innerMap,
                            position: userLocation,
                            title: "現在地",
                        });
                    },
                    (error) => {
                        // エラー理由をスマホ画面に分かりやすく表示
                        let msg = "位置情報の取得に失敗しました。";
                        if (error.code === 1) msg = "位置情報の利用が許可されていません。スマホやブラウザの設定を確認してください。";
                        if (error.code === 2) msg = "電波状態が悪く、現在地を特定できませんでした。";
                        if (error.code === 3) msg = "位置情報の取得がタイムアウトしました。";
                        alert(msg);
                    },
                    {
                        enableHighAccuracy: true, // ★スマホのGPSを高精度モードにする
                        timeout: 10000,           // 10秒でタイムアウト
                        maximumAge: 0
                    }
                );
            } else {
                alert("お使いのブラウザは位置情報に対応していません。");
            }

            // ------------------------------------------
            // スプレッドシートからデータ取得してピンを立てる
            // ------------------------------------------
            try {
                const spots = await fetchSpreadsheetData(SPREADSHEET_CSV_URL);

                spots.forEach(spot => {
                    if (isNaN(spot.lat) || isNaN(spot.lng)) return; // 座標がないデータはスキップ

                    const marker = new AdvancedMarkerElement({
                        map: innerMap,
                        position: { lat: spot.lat, lng: spot.lng },
                        title: spot.name,
                    });

                    marker.addListener('click', () => {
                        infoWindow.close();
                        infoWindow.setContent(`
                            <div class="info-window">
                                <strong>${spot.name}</strong>
                                <p>${spot.comment}</p>
                            </div>
                        `);
                        infoWindow.open(marker.map, marker);
                    });
                });
            } catch (err) {
                console.error("スプレッドシートのデータ取得に失敗しました:", err);
            }
        }

        // ------------------------------------------
        // CSVの内容からJSの配列に変換する関数
        // ------------------------------------------
        async function fetchSpreadsheetData(url) {
            const response = await fetch(url);
            const csvText = await response.text();

            // 行ごとに分割
            const rows = csvText.trim().split('\n');
            // 1行目（ヘッダー）を除外してデータ部分だけ処理
            const dataRows = rows.slice(1);

            return dataRows.map(row => {
                // カンマで分割（簡易パース）
                const cols = row.split(',').map(col => col.trim().replace(/^"|"$/g, ''));
                return {
                    name: cols[0],
                    lat: parseFloat(cols[1]),
                    lng: parseFloat(cols[2]),
                    comment: cols[3]
                };
            });
        }

        init();
    </script>
</body>

</html>
